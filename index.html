<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BRI Tracker | China's Belt and Road Initiative</title>
    <meta name="description" content="An interactive map and globe tracking China's Belt and Road Initiative projects around the world." />
    <meta name="theme-color" content="#0b0d10" />
    <script>
      // Apply the saved theme before first paint so light mode doesn't flash dark. main.js owns it after this.
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').content = '#d6ebf8';
        }
      } catch {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />
  </head>
  <body class="h-full overflow-hidden bg-night font-sans text-neutral-100 antialiased light:bg-day light:text-neutral-900">
    <!-- Map / globe canvas -->
    <div class="fixed inset-0">
      <div id="map" class="h-full w-full" aria-label="Map of Belt and Road Initiative projects"></div>
    </div>

    <!-- Header -->
    <header
      class="pointer-events-none fixed inset-x-0 top-0 z-10 flex items-start justify-between gap-3 p-3 pt-[max(0.75rem,env(safe-area-inset-top))] sm:p-5"
    >
      <div id="brand" class="pointer-events-auto rounded-2xl border border-white/10 bg-neutral-900/75 px-4 py-3 shadow-xl backdrop-blur-md light:border-black/10 light:bg-white/80">
        <h1 class="text-lg font-black uppercase leading-none tracking-[0.18em] sm:text-xl">
          BRI <span class="text-brand">Tracker</span>
        </h1>
        <p class="mt-1.5 text-xs text-neutral-400 sm:text-sm light:text-neutral-600">
          <span class="hidden sm:inline">China's Belt and Road Initiative</span>
          <span class="hidden text-neutral-600 sm:inline light:text-neutral-400" aria-hidden="true">·</span>
          <span id="project-count" class="font-medium text-neutral-200 light:text-neutral-800">Loading…</span>
        </p>
      </div>

      <div class="flex shrink-0 items-start gap-1.5 sm:gap-2">
        <!-- 2D / 3D toggle -->
        <div
          id="view-toggle"
          role="radiogroup"
          aria-label="Map view"
          class="pointer-events-auto relative grid grid-cols-2 rounded-full border border-white/10 bg-neutral-900/75 p-1 shadow-xl backdrop-blur-md light:border-black/10 light:bg-white/80"
        >
          <span
            id="toggle-thumb"
            aria-hidden="true"
            class="absolute inset-y-1 left-1 w-[calc(50%-0.25rem)] rounded-full bg-brand shadow transition-transform duration-500 ease-out"
          ></span>
          <button
            type="button"
            role="radio"
            data-mode="2d"
            aria-checked="true"
            class="relative z-10 flex items-center justify-center gap-1.5 rounded-full px-3 py-1.5 text-sm font-bold text-neutral-400 transition-colors aria-checked:text-neutral-950 max-sm:px-2.5 sm:px-4 light:text-neutral-500"
          >
            <svg class="size-4 shrink-0 max-sm:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z" /><path d="M9 4v14M15 6v14" />
            </svg>
            2D
          </button>
          <button
            type="button"
            role="radio"
            data-mode="3d"
            aria-checked="false"
            class="relative z-10 flex items-center justify-center gap-1.5 rounded-full px-3 py-1.5 text-sm font-bold text-neutral-400 transition-colors aria-checked:text-neutral-950 max-sm:px-2.5 sm:px-4 light:text-neutral-500"
          >
            <svg class="size-4 shrink-0 max-sm:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" />
            </svg>
            3D
          </button>
        </div>

        <!-- Dark / light switch; the thumb and icon colours follow data-theme through light: classes.
             Phones get a single round button showing the current theme, to leave the title room. -->
        <button
          id="theme-toggle"
          type="button"
          role="switch"
          aria-checked="false"
          aria-label="Light mode"
          title="Switch to light mode"
          class="pointer-events-auto relative grid grid-cols-2 rounded-full border border-white/10 bg-neutral-900/75 p-1 shadow-xl backdrop-blur-md max-sm:grid-cols-1 light:border-black/10 light:bg-white/80"
        >
          <span
            aria-hidden="true"
            class="absolute inset-y-1 left-1 w-[calc(50%-0.25rem)] rounded-full bg-brand shadow transition-transform duration-500 ease-out max-sm:hidden light:translate-x-full"
          ></span>
          <span class="grid size-8 place-items-center text-brand sm:hidden light:text-orange-600" aria-hidden="true">
            <svg class="size-4 light:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z" />
            </svg>
            <svg class="hidden size-4 light:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
          </span>
          <span class="relative z-10 grid h-8 place-items-center px-2.5 text-neutral-950 transition-colors max-sm:hidden light:text-neutral-500">
            <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z" />
            </svg>
          </span>
          <span class="relative z-10 grid h-8 place-items-center px-2.5 text-neutral-400 transition-colors max-sm:hidden light:text-neutral-950">
            <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
          </span>
        </button>
      </div>
    </header>

    <!-- Zoom controls -->
    <div
      id="controls"
      class="fixed right-3 z-10 flex flex-col overflow-hidden rounded-xl border border-white/10 bg-neutral-900/75 shadow-xl backdrop-blur-md transition-[bottom] duration-500 ease-out sm:right-5 light:border-black/10 light:bg-white/80"
      style="bottom: max(3.25rem, calc(env(safe-area-inset-bottom) + 2.75rem))"
    >
      <button type="button" data-action="zoom-in" aria-label="Zoom in" class="grid size-10 place-items-center text-neutral-300 transition hover:bg-white/10 hover:text-white light:text-neutral-600 light:hover:bg-black/5 light:hover:text-neutral-950">
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
      </button>
      <button type="button" data-action="zoom-out" aria-label="Zoom out" class="grid size-10 place-items-center border-t border-white/10 text-neutral-300 light:border-black/10 transition hover:bg-white/10 hover:text-white light:text-neutral-600 light:hover:bg-black/5 light:hover:text-neutral-950">
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14" /></svg>
      </button>
      <button type="button" data-action="reset" aria-label="Reset view" class="grid size-10 place-items-center border-t border-white/10 text-neutral-300 light:border-black/10 transition hover:bg-white/10 hover:text-white light:text-neutral-600 light:hover:bg-black/5 light:hover:text-neutral-950">
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8" /><path d="M3 3v5h5" />
        </svg>
      </button>
    </div>

    <!-- Project details: bottom sheet on phones, floating card at sm, full-height left panel from md (768px) up.
         --brand-bottom is set in main.js to the header card's bottom edge so the panel never overlaps it. -->
    <section
      id="sheet"
      aria-labelledby="sheet-name"
      aria-hidden="true"
      inert
      class="fixed inset-x-0 bottom-0 z-20 mx-auto flex max-h-[62dvh] w-full translate-y-full flex-col overflow-hidden rounded-t-3xl border border-b-0 border-white/10 bg-neutral-900/95 shadow-[0_-12px_40px_rgba(0,0,0,0.5)] light:border-black/10 light:bg-white/95 backdrop-blur-xl transition-transform duration-500 ease-[cubic-bezier(0.22,1,0.36,1)] data-[open=true]:translate-y-0 data-[open=false]:shadow-none sm:bottom-5 sm:max-h-[min(34rem,calc(100dvh-8rem))] sm:max-w-lg sm:rounded-3xl sm:border-b sm:data-[open=false]:translate-y-[calc(100%+2rem)] md:inset-x-auto md:top-[calc(var(--brand-bottom,5.75rem)+0.75rem)] md:left-5 md:mx-0 md:max-h-none md:w-[26rem] md:shadow-[12px_0_40px_rgba(0,0,0,0.5)] md:data-[open=false]:translate-y-0 md:data-[open=false]:-translate-x-[calc(100%+2rem)] md:data-[open=false]:shadow-none"
      data-open="false"
    >
      <div id="sheet-handle" class="flex shrink-0 justify-center pt-2.5 pb-1 sm:hidden" aria-hidden="true">
        <span class="h-1.5 w-10 rounded-full bg-white/20 light:bg-black/15"></span>
      </div>

      <button
        id="sheet-close"
        type="button"
        aria-label="Close project details"
        class="absolute top-3 right-3 z-10 grid size-9 place-items-center rounded-full bg-black/40 text-neutral-300 backdrop-blur transition hover:bg-black/60 hover:text-white"
      >
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>

      <!-- The native scrollbar is hidden so it doesn't take width from the image and text; #sheet-thumb
           (positioned by main.js) is drawn over the content instead. -->
      <div
        id="sheet-body"
        class="min-h-0 flex-1 overflow-y-auto overscroll-contain pb-[max(1.25rem,env(safe-area-inset-bottom))] [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
      >
        <img id="sheet-image" alt="" class="hidden aspect-[16/7] w-full object-cover sm:rounded-t-3xl" />
        <div class="px-5 pt-3 sm:px-6 sm:pt-5">
          <div class="flex flex-col items-start gap-1.5">
            <span id="sheet-type" class="inline-flex items-center rounded-full bg-brand/15 px-2.5 py-1 text-[14px]/[18px] font-bold uppercase tracking-wider text-brand light:text-orange-700">
              <span id="sheet-type-text"></span>
            </span>
            <!-- Status tag; colour classes are set per status in main.js (STATUS_STYLES) -->
            <span id="sheet-status" class="hidden items-center rounded-full px-2.5 py-1 text-[14px]/[18px] font-bold uppercase tracking-wider"></span>
          </div>
          <h2 id="sheet-name" class="mt-2.5 pr-10 text-[18px]/[24px] font-bold text-white light:text-neutral-950"></h2>
          <dl id="sheet-meta" class="mt-2 flex flex-wrap gap-x-4 gap-y-1 text-sm text-neutral-400 light:text-neutral-600"></dl>
          <div id="sheet-description" class="mt-4 space-y-3 text-[0.9375rem] leading-relaxed text-neutral-300 light:text-neutral-700"></div>
          <a
            id="sheet-link"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            class="mt-5 hidden items-center gap-1.5 rounded-full bg-white px-4 py-2 text-sm font-bold text-neutral-950 transition hover:bg-brand light:bg-neutral-900 light:text-white light:hover:bg-brand light:hover:text-neutral-950"
          >
            Learn more
            <svg class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9" /></svg>
          </a>
        </div>
      </div>

      <div
        id="sheet-thumb"
        aria-hidden="true"
        hidden
        class="absolute top-0 right-1 z-10 w-1.5 touch-none rounded-full bg-white/30 transition-[width,background-color] hover:w-2 hover:bg-white/50 data-[dragging=true]:w-2 data-[dragging=true]:bg-white/50 light:bg-black/25 light:hover:bg-black/45 light:data-[dragging=true]:bg-black/45"
      ></div>
    </section>

    <!-- Loading / error overlay -->
    <div id="status" class="pointer-events-none fixed inset-0 z-30 grid place-items-center bg-night transition-opacity duration-700 light:bg-day">
      <div class="flex flex-col items-center gap-3 text-neutral-400 light:text-neutral-600">
        <span class="size-8 animate-spin rounded-full border-2 border-white/10 border-t-brand light:border-black/10 light:border-t-brand" aria-hidden="true"></span>
        <p id="status-text" class="text-sm">Loading projects…</p>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
